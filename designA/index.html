<!doctype html>
<html lang="ko">
<head>

<title>LIO Skill Core — Flow Prototype · Design A (Storybook)</title>

<body>

  <div class="topbar">
    <span class="brandtag">LIO <b>Skill Core</b></span>
    <span class="designtag">DESIGN A · Storybook</span>
    <span class="spacer"></span>
    <span class="hint">← → 방향키로 이동 · Index에서 화면 점프 · ⓘ 화면정의</span>
  </div>

  <div id="stage"></div>

  <div class="controls">
    <button class="navbtn ghost" id="btn-prev">◀ 이전</button>
    <button class="navbtn" id="btn-next">다음 ▶</button>
    <div class="cinfo">
      <span class="cs" id="nav-slide">Slide</span>
      <span class="ct" id="nav-title">—</span>
    </div>
    <div class="pagejump">
      <span class="pj-label">페이지</span>
      <input type="number" id="pj-input" min="3" inputmode="numeric" placeholder="#">
      <button class="navbtn" id="pj-go">이동</button>
    </div>
    <span class="spacer"></span>
    <button class="navbtn ghost" id="btn-jump">☰ Index</button>
    <button class="navbtn ghost" id="btn-spec">ⓘ 화면정의</button>
  </div>

  <div class="overlay hidden" id="jump-overlay">
    <div class="jump-box">
      <div class="jump-head"><h3>화면 Index — 전체 Flow (PPTX v1.1 · Slide 5~49)</h3><button class="x" id="jump-close">✕</button></div>
      <div id="jump-list"></div>
    </div>
  </div>

  <aside class="spec-panel hidden" id="spec-panel">
    <button class="close-s" onclick="document.getElementById('spec-panel').classList.add('hidden')">✕</button>
    <h3 id="spec-slide">화면 정의</h3>
    <div class="ssub">화면정의서 Description</div>
    <ul id="spec-list"></ul>
  </aside>

  <script>
    window.LIO_THEME = 'A';
    window.LIO_SPLASH_VIDEO = '../IMAGE/intro_a.mp4';   // A_Intro_cut1 애니메이션
    window.LIO_SPLASH_POSTER = '../IMAGE/heroA.png';    // 재생 전 첫 프레임
  </script>
  <script src="../prototype/flow-data.js?v=20260808c"></script>
  <script src="../prototype/kr-map.js?v=20260808a"></script>
  <script src="../prototype/engine.js?v=20260808c"></script>
