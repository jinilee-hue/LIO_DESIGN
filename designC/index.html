<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>LIO Skill Core — Flow Prototype · Design C (Simple)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../prototype/base.css?v=20260807j">
<link rel="stylesheet" href="theme-c.css?v=20260812b">
</head>
<body>

  <!-- 상단 유틸바 -->
  <div class="topbar">
    <span class="brandtag">LIO <b>Skill Core</b></span>
    <span class="designtag">DESIGN C · Simple</span>
    <span class="spacer"></span>
    <span class="hint">← → 방향키로 이동 · Index에서 화면 점프 · ⓘ 화면정의</span>
  </div>

  <!-- 캔버스 -->
  <div id="stage"></div>

  <!-- 하단 컨트롤 -->
  <div class="controls">
    <button class="navbtn ghost" id="btn-prev">◀ 이전</button>
    <button class="navbtn" id="btn-next">다음 ▶</button>
    <div class="cinfo">
      <span class="cs" id="nav-slide">Slide</span>
      <span class="ct" id="nav-title">—</span>
    </div>
    <div class="pagejump">
      <span class="pj-label">페이지</span>
      <input type="number" id="pj-input" min="3" inputmode="numeric" placeholder="#">
      <button class="navbtn" id="pj-go">이동</button>
    </div>
    <span class="spacer"></span>
    <button class="navbtn ghost" id="btn-jump">☰ Index</button>
    <button class="navbtn ghost" id="btn-spec">ⓘ 화면정의</button>
  </div>

  <!-- Index (jump) -->
  <div class="overlay hidden" id="jump-overlay">
    <div class="jump-box">
      <div class="jump-head"><h3>화면 Index — 전체 Flow (PPTX v1.2 · Slide 5~64 · 기획서 PAGE 4~67)</h3><button class="x" id="jump-close">✕</button></div>
      <div id="jump-list"></div>
    </div>
  </div>

  <!-- 화면정의 패널 -->
  <aside class="spec-panel hidden" id="spec-panel">
    <button class="close-s" id="btn-spec-close" onclick="document.getElementById('spec-panel').classList.add('hidden')">✕</button>
    <h3 id="spec-slide">화면 정의</h3>
    <div class="ssub">화면정의서 Description</div>
    <ul id="spec-list"></ul>
  </aside>

  <!-- C 는 B 의 심플 버전이다. 동작(엔진 분기 · bOnly 화면 필터)은 B 와 같아야 하므로
       LIO_THEME 은 'B' 로 두고, 겉모습만 theme-c.css 로 갈라낸다.
       이렇게 하면 공용 prototype/* 을 건드리지 않아 A · B 에 영향이 없다.
       화면별 구분이 필요하면 body 의 data-variant="C" 를 CSS 에서 쓴다. -->
  <script>window.LIO_THEME = 'B'; document.documentElement.dataset.variant = 'C';</script>
  <script src="../prototype/flow-data.js?v=20260812c"></script>
  <!-- C 의 축소된 FLOW — engine.js 가 목록을 읽기 전에 화면을 걷어낸다 (순서 중요) -->
  <script src="c-flow.js?v=20260812a"></script>
  <script src="../prototype/kr-map.js?v=20260808a"></script>
  <script src="../prototype/engine.js?v=20260813a"></script>
  <!-- slide 5 LIO 등장 발소리 -->
  <script src="lio-footsteps.js?v=20260806a"></script>
  <!-- 정/오답 LIO 반응 -->
  <script src="quiz-reaction.js?v=20260811b"></script>
  <!-- 하단 LIO 안내 말풍선 (Figma C_SLIDE16) — slide 15 · 16 -->
  <script src="c-lio-guide.js?v=20260812c"></script>
</body>
</html>
